<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto - Yaourt à l'axolotl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styleregistrar_productos.css') }}">
</head>
<body>

    <div class="form-container">
        
        <div class="header-navigation">
            <a href="/" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
        </div>

        <div class="form-card">
            
            <div class="form-header">
                <h2>Registrar Nuevo <em>Producto</em></h2>
                <p>Ingresa los detalles para añadir el producto al inventario</p>
            </div>

            {% with mensajes = get_flashed_messages() %}
                {% if mensajes %}
                    <div class="flash-messages">
                        {% for mensaje in mensajes %}
                            <div class="flash-alert">
                                <i class="fa-solid fa-circle-info"></i> {{ mensaje }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="/guardar" method="POST">

                <div class="input-group">
                    <label for="nombre">Nombre del producto</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-tag input-icon"></i>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Yogur de Fresa" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="precio">Precio ($)</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-dollar-sign input-icon"></i>
                            <input type="number" step="0.01" id="precio" name="precio" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="stock">Cantidad en Stock</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-cubes input-icon"></i>
                            <input type="number" id="stock" name="stock" placeholder="0" required>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="imagen">Enlace de la imagen del producto</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-link input-icon"></i>
                        <input type="url" id="imagen" name="imagen" placeholder="https://ejemplo.com/imagen.jpg" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Guardar Producto
                </button>

            </form>

        </div>
    </div>

</body>
</html>
